name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test detector, tracking, metrics, IO and CLI
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel and check entry point
        run: |
          python -m pip uninstall -y lidar-vehicle-perception
          python -m pip install dist/*.whl
          cd /tmp
          lidar-perception --help
