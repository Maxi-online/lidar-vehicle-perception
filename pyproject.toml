[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-vehicle-perception"
version = "0.1.0"
description = "Geometric LiDAR vehicle proposals, dimensions and multi-object tracking with offline replay and optional ROS 2."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{name = "Maxi-online"}]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Repository = "https://github.com/Maxi-online/lidar-vehicle-perception"
Issues = "https://github.com/Maxi-online/lidar-vehicle-perception/issues"

[project.scripts]
lidar-perception = "lidar_vehicle_perception.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
